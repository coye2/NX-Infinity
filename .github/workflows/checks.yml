name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.402'
      - run: dotnet build src/NxInfinity.slnx -c Release
      - run: dotnet run --project src/tests/NxInfinity.Runtime.ContractTests -c Release --no-build
      - run: dotnet run --project src/tests/NxInfinity.Runtime.Services.Tests -c Release --no-build

  source-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: |
            9.0.100
            10.0.402
      - name: Test source-baseline tools
        run: NXI_TEST_SCRATCH="$RUNNER_TEMP" python3 -B build/source-baseline/test_tools.py
      - name: Restore pinned core source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t kenji_revisions < <(
            python3 build/source-baseline/restore.py --print-kenji-revisions
          )
          test "${#kenji_revisions[@]}" -eq 12
          git init --quiet "$RUNNER_TEMP/kenji"
          git -C "$RUNNER_TEMP/kenji" remote add origin https://starforgejo.dev/projects/Kenji-NX.git
          git -C "$RUNNER_TEMP/kenji" fetch --no-tags --depth=1 origin "${kenji_revisions[@]}"
          git -C "$RUNNER_TEMP/kenji" checkout --detach "${kenji_revisions[0]}"
          git clone --filter=blob:none --no-checkout https://github.com/ChanseyIsTheBest/ryujinx.git "$RUNNER_TEMP/later-ryujinx"
          git -C "$RUNNER_TEMP/later-ryujinx" checkout --detach 20888e6d1f96bcf1a59f415c745c684e38529503
          python3 build/source-baseline/restore.py \
            --kenji-repo "$RUNNER_TEMP/kenji" \
            --later-repo "$RUNNER_TEMP/later-ryujinx" \
            --output "$RUNNER_TEMP/nx-v1-source"
      - name: Build restored core
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/nx-v1-source"
          dotnet build src/Ryujinx.HLE/Ryujinx.HLE.csproj -c Release
          dotnet build src/Ryujinx.Graphics.Vulkan/Ryujinx.Graphics.Vulkan.csproj -c Release
          dotnet build src/Ryujinx.Audio.Backends.OpenAL/Ryujinx.Audio.Backends.OpenAL.csproj -c Release
      - name: Build and smoke core host
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/src"
          dotnet publish core/NxInfinity.Core/NxInfinity.Core.csproj -c Release \
            -p:CoreSourceRoot="$RUNNER_TEMP/nx-v1-source" \
            -o "$RUNNER_TEMP/nx-core-host"
          cd "$GITHUB_WORKSPACE"
          python3 build/source-baseline/smoke_worker.py \
            --dotnet "$(command -v dotnet)" \
            --worker "$RUNNER_TEMP/nx-core-host/NxInfinity.Core.dll"
